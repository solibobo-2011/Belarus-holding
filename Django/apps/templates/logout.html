<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimdan chiqish - Belarus Holding</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0d1b2a;
            background-image: radial-gradient(#1b4965 10%, transparent 10%);
            background-size: 20px 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .logout-container {
            background: #ffffff;
            color: #333;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #ff7a00;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
        }
        h2 {
            color: #00469b;
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            background: #00469b;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-home:hover {
            background: #003373;
        }
        /* YANGI QO'SHILGAN CSS */
        .btn-logout {
            display: inline-block;
            background: #e63946;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }
        .btn-logout:hover {
            background: #c1121f;
        }
    </style>
</head>
<body>

    <div class="logout-container">
        <div class="icon-box">
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <h2>Tizimdan chiqish</h2>
        <p>Haqiqatdan ham akkauntingizdan butunlay chiqmoqchimisiz?</p>
        
        <a href="index.html" class="btn-home">Bosh sahifaga qaytish</a>
        <button onclick="tizimdanButunlayChiqish()" class="btn-logout">Tizimdan butunlay chiqish</button>
    </div>

    <script>
        // YANGI STRUKTURA
        function tizimdanButunlayChiqish() {
            // Brauzer xotiralarini tozalash
            localStorage.clear();
            sessionStorage.clear();

            // Cookie fayllarni o'chirish
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });

            // Chiqib ketgandan keyin yo'naltiriladigan sahifa (masalan: login.html yoki index.html)
            window.location.href = "login.html"; 
        }
    </script>

</body>
</html>
