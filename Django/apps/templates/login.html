<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish - Belarus Holding</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b132b;
            background-image: 
                radial-gradient(at 10% 20%, rgba(27, 73, 101, 0.4) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 70, 155, 0.3) 0px, transparent 50%),
                radial-gradient(#1c2541 15%, transparent 15%);
            background-size: 100% 100%, 100% 100%, 30px 30px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon-wrapper {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #0056b3, #003373);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(0, 70, 155, 0.3);
        }
        h2 {
            color: #0b132b;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
        }
        .input-box {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8d99ae;
            font-size: 16px;
            transition: color 0.3s;
        }
        .input-box input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1.5px solid #edf2f4;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 14px;
            color: #2b2d42;
            outline: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .input-box input:focus {
            border-color: #00469b;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 70, 155, 0.1);
        }
        .input-box input:focus + i {
            color: #00469b;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #00469b;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 70, 155, 0.2);
        }
        .btn-primary:hover {
            background: #003373;
            transform: translateY(-1px);
        }
        .btn-google {
            background: #ffffff;
            color: #4a5568;
            border: 1.5px solid #e2e8f0;
        }
        .btn-google:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }
        .btn-google i {
            color: #ea4335;
            font-size: 16px;
        }
        .btn-danger {
            background: #fff5f5;
            color: #e53e3e;
            border: 1.5px solid #fed7d7;
            margin-top: 8px;
        }
        .btn-danger:hover {
            background: #fff5f5;
            border-color: #e53e3e;
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.1);
        }
        .text-divider {
            margin: 20px 0;
            color: #a0aec0;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-divider::before, .text-divider::after {
            content: "";
            flex: 1;
            background: #edf2f4;
            height: 1px;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Tizimga kirish</h2>
        
<form action="/login/" method="POST" id="loginForm">
    {% csrf_token %} 
    
    <div class="input-box">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Login yoki elektron pochta" required>
    </div>
    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Parol" required>
    </div>
    
    <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Login orqali kirish
    </button>
        </form> <div class="text-divider">yoki</div>

        <button type="button" onclick="googleBilanKirish()" class="btn btn-google">
            <i class="fa-brands fa-google"></i> Google hisobi bilan kirish
        </button>

        <div class="text-divider">Xavfsizlik</div>

        <button type="button" onclick="tizimdanButunlayChiqish()" class="btn btn-danger">
            <i class="fa-solid fa-power-off"></i> Tizimdan butunlay chiqish
        </button>
    </div>

    <script>
        // Google hisoblar oynasini ochish
        function googleBilanKirish() {
            window.open(
                "https://accounts.google.com/v3/signin/identifier?flowName=GlifWebSignIn&flowEntry=ServiceLogin", 
                "Google Login", 
                "width=500,height=600,left=350,top=100"
            );
        }

        // Tizimdan chiqish va keshni tozalash
        function tizimdanButunlayChiqish() {
            localStorage.clear();
            sessionStorage.clear();
            
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });

            alert("Siz tizimdan muvaffaqiyatli chiqdingiz, barcha maʼlumotlar tozalandi.");
            window.location.href = "/"; 
        }
    </script>

</body>
</html>
